databases:
  - name: plano-de-aula-db
    plan: free
    databaseName: planos
    user: planos

services:
  - type: web
    name: plano-de-aula
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -t 180 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plano-de-aula-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_API_KEY
        sync: false
      - key: APP_SENHA
        sync: false
      - key: SUPERVISAO_SENHA
        sync: false
      - key: SUPERVISAO_NOME
        sync: false
      - key: DIRECAO_NOME
        sync: false
      - key: SECRET_KEY
        generateValue: true
