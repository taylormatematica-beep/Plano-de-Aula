databases:
  - name: plano-de-aula-db
    plan: free
    databaseName: planos
    user: planos

services:
  - type: web
    name: plano-de-aula
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -t 180 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plano-de-aula-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_API_KEY
        sync: false
      - key: SUPERVISAO_EMAILS
        sync: false
      - key: SUPERVISAO_SENHA
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPERVISAO_NOME
        sync: false
      - key: DIRECAO_NOME
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
