services:
  - type: web
    name: plano-de-aula
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -t 180 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: AI_API_KEY
        sync: false
      - key: APP_SENHA
        sync: false
